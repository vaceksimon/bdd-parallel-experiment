[package]
name = "bdd-parallel-experiment"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-queue = "0.3.14"
dashmap = "6.2.1"
uuid = { version = "1.29", features = ["v5", "v7"] }
biodivine-lib-bdd = { version = "0.6.3", optional = true }

[features]
test-utils = ["dep:biodivine-lib-bdd"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "thousand_benchmark"
harness = false

[[bench]]
name = "thousands_benchmark"
harness = false

[[bench]]
name = "ten_thousands_benchmark"
harness = false

[[bench]]
name = "hundred_thousands_benchmark"
harness = false

[[bench]]
name = "million_benchmark"
harness = false

[[bench]]
name = "ten_million_benchmark"
harness = false
